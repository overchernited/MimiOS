name: build-firmware

on:
  push:
    tags: ['firmware-v*']
  workflow_dispatch:
     inputs:
      version:
        description: 'Número de versión (Ej: 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.chip }}
    runs-on: ubuntu-latest

    env:
      FIRMWARE_VERSION: ${{ github.event.inputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32
            chip: esp32
          - env: esp32-s3
            chip: esp32s3
          - env: esp32-c3
            chip: esp32c3
          - env: esp32-s2
            chip: esp32s2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --user platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
        working-directory: firmware

      - name: Build filesystem ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }} -t buildfs
        working-directory: firmware

      - name: Upload ${{ matrix.chip }} firmware
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node tools/upload-firmware/index.js \
            ".pio/build/${{ matrix.env }}/firmware.bin" \
            "${{ matrix.chip }}" \
            "${{ inputs.version }}"
        working-directory: firmware
