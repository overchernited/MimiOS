name: build-desktop

on:
  push:
    tags: ['cortex-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (Ej: 1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=cortex-v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Draft Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.set_tag.outputs.tag }}
          name: "MimiOS Cortex v${{ inputs.version || github.ref_name }}"
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: dist:linux
            artifact: cortex-linux
          - os: windows-latest
            platform: win
            command: dist:win
            artifact: cortex-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cortex/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cortex
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.platform }}
        working-directory: cortex
        # Forzamos 'always' porque el Draft ya fue creado de forma segura en el paso anterior
        run: pnpm run ${{ matrix.command }} -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cortex/dist-electron/**
          if-no-files-found: error
