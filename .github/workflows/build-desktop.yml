name: build-desktop

on:
  push:
    tags: ['cortex-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (Ej: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: dist:linux
          - os: windows-latest
            platform: win
            command: dist:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cortex/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cortex
        run: pnpm install --frozen-lockfile

      # 1. Compila los instaladores de forma normal (Sin intentar subirlos desde aquí)
      - name: Build Application
        working-directory: cortex
        run: pnpm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # 2. Esta acción agarra los archivos generados y los sube directo a un Draft Release
      - name: Create Draft and Upload Binaries
        uses: ncipollo/release-action@v1
        with:
          tag: "cortex-v${{ inputs.version || github.ref_name }}"
          name: "MimiOS Cortex v${{ inputs.version || github.ref_name }}"
          draft: true
          allowUpdates: true # Permite que Windows y Linux suban archivos al mismo borrador
          artifacts: "cortex/dist-electron/*.exe,cortex/dist-electron/*.deb,cortex/dist-electron/*.AppImage"
          token: ${{ secrets.GITHUB_TOKEN }}
